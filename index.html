<style>
:root{--bg:#efe7d8;--fg:#3a2f25;--card:#f8f2e4;--ac:#a9744f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.8 'Hiragino Mincho ProN','Noto Serif JP',serif}
#a{max-width:560px;margin:auto;padding:8px}#top{display:flex;justify-content:space-between;font-size:13px;opacity:.85;height:26px}
canvas{width:100%;display:block;background:#e8decb;border-radius:10px;touch-action:none}
#m{min-height:4.2em;padding:8px 4px;white-space:pre-wrap}
button{font:inherit;font-size:14px;margin:3px;padding:8px 14px;border:0;border-radius:18px;background:var(--ac);color:#fff;cursor:pointer}
.sw{display:inline-block;width:46px;height:46px;border-radius:50%;margin:4px;border:2px solid transparent;cursor:pointer}.sw.on{border-color:#fff}
#sh{display:none;flex-wrap:wrap;gap:8px}#sh canvas{width:100px;height:100px;cursor:pointer}
#op{position:fixed;inset:0;z-index:30;background:#000 center 22%/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:10vh;transition:opacity .9s}
#ot{font:clamp(26px,7vw,60px)/1.2 'Hiragino Mincho ProN','Noto Serif JP',serif;letter-spacing:.18em;color:#f1ece0;text-shadow:0 2px 16px rgba(0,0,0,.8);margin-bottom:6vh;text-align:center}

#en{display:none;position:fixed;inset:0;z-index:40;background:#000}#ei{position:absolute;inset:0;background:center 30%/cover no-repeat;opacity:0;transition:opacity 3s}
#et{position:absolute;left:0;right:0;bottom:16%;text-align:center;color:#fff;font:clamp(20px,4.6vw,38px) 'Hiragino Mincho ProN','Noto Serif JP',serif;letter-spacing:.2em;text-shadow:0 2px 14px #000;opacity:0;transition:opacity 2.5s}
#eb{position:absolute;right:18px;bottom:18px;opacity:0;transition:opacity 2s;background:rgba(0,0,0,.45);border:1px solid #8a7e6a}
#gm{font-size:12px}
#eg{display:none;position:absolute;inset:0;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;opacity:0;transition:opacity 3s}#eg img{width:100%;height:100%;object-fit:cover;min-height:0}#eg::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.4)}#et{z-index:2}#eb{z-index:2}
#tc{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:35;align-items:center;justify-content:center}#tb{max-width:420px;width:calc(100% - 28px);color:#3a2f25;background:#f8f2e4;border-radius:12px;padding:14px;text-align:center}#tb img{width:min(260px,62vw);border-radius:8px}#tt{white-space:pre-wrap;font-size:17px;margin:10px 0;min-height:4.5em}
